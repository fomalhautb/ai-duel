<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 站点图标：两块深蓝箭头夹住中间的金色四角星。
       左右两块用同色描边 + round 连接来做圆角，比手写圆角路径省事；
       描边会向外扩 4.5，两块之间的缺口要按这个量预留，否则中间会糊成一片。 -->
  <g fill="#1B2B4B" stroke="#1B2B4B" stroke-width="9" stroke-linejoin="round">
    <path d="M17 15 L38 42 L38 58 L17 85 Z" />
    <path d="M83 15 L62 42 L62 58 L83 85 Z" />
  </g>
  <!-- 四角星：四个尖端之间用二次贝塞尔向中心内凹。 -->
  <path fill="#D6A759"
        d="M50 34 Q53 47 63 50 Q53 53 50 66 Q47 53 37 50 Q47 47 50 34 Z" />
</svg>
