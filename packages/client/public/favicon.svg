<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 站点图标：一颗浅橙黄色四芒星。
       只用直线：四条星芒从中心附近 7 的半宽一路收到尖端，
       尖端不是一个点，而是留了 1 宽的一小段平口 —— 完全的尖角在 16px 的 favicon 里
       会被抗锯齿抹掉，留一点平口反而更实。
       图形几乎占满 viewBox，缩到小尺寸时才不至于糊成一个点。 -->
  <path fill="#F5B95C"
        d="M49.5 4 L50.5 4 L57 43 L96 49.5 L96 50.5 L57 57
           L50.5 96 L49.5 96 L43 57 L4 50.5 L4 49.5 L43 43 Z" />
</svg>
